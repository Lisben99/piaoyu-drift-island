# Render Blueprint - Drift Island Backend
# https://render.com/docs/blueprint-spec
# 
# Usage: Push this file to your GitHub repo, then go to
# https://dashboard.render.com/select-repo?type=blueprint
# and select your repository. Render will auto-create all services.

databases:
  - name: drift-island-db
    databaseName: drift_island
    plan: free
    ipAllowList: []

services:
  - type: web
    name: drift-island-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: drift-island-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SMS_PROVIDER
        value: aliyun
      - key: ALIYUN_SMS_KEY
        sync: false
      - key: ALIYUN_SMS_SECRET
        sync: false
      - key: ALIYUN_SMS_SIGN
        sync: false
      - key: ALIYUN_SMS_TEMPLATE
        sync: false
      - key: PAYMENT_PROVIDER
        value: dev
      - key: MODERATION_PROVIDER
        value: tencent
      - key: TENCENT_SECRET_ID
        sync: false
      - key: TENCENT_SECRET_KEY
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
    autoDeploy: true
