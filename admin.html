<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>漂流大厅 · 管理后台</title>
<script src="config.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f0f2f5;color:#1a1a1a}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font-family:inherit;outline:none;resize:none}

/* Layout */
.admin-layout{display:flex;min-height:100vh}
.sidebar{width:220px;background:#1a2332;color:#fff;flex-shrink:0;display:flex;flex-direction:column;position:fixed;height:100vh;overflow-y:auto;z-index:100}
.sidebar__logo{padding:20px;font-size:18px;font-weight:700;border-bottom:1px solid rgba(255,255,255,.1)}
.sidebar__nav{flex:1;padding:12px 0}
.sidebar__item{display:flex;align-items:center;gap:10px;padding:12px 20px;color:rgba(255,255,255,.6);font-size:14px;cursor:pointer;transition:all .2s}
.sidebar__item:hover{color:#fff;background:rgba(255,255,255,.05)}
.sidebar__item.active{color:#fff;background:rgba(31,122,116,.3);border-left:3px solid #1f7a74}
.sidebar__badge{margin-left:auto;background:#ef7b62;color:#fff;font-size:10px;padding:2px 6px;border-radius:10px;font-weight:700}
.main{flex:1;margin-left:220px;padding:24px;min-width:0}
.main__header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.main__title{font-size:22px;font-weight:700}
.main__user{display:flex;align-items:center;gap:10px;font-size:13px;color:#666}

/* Login */
.login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1a2332,#1f7a74)}
.login-card{width:360px;background:#fff;border-radius:16px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.login-card h1{font-size:20px;font-weight:700;margin-bottom:6px}
.login-card p{font-size:13px;color:#888;margin-bottom:24px}
.login-field{margin-bottom:16px}
.login-field label{display:block;font-size:12px;color:#666;font-weight:600;margin-bottom:6px}
.login-field input{width:100%;padding:12px 14px;border:1px solid #ddd;border-radius:10px;font-size:14px}
.login-btn{width:100%;padding:14px;background:#1f7a74;color:#fff;border-radius:10px;font-size:15px;font-weight:700;margin-top:8px}
.login-btn:active{opacity:.88}

/* Cards */
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:16px}
.card__title{font-size:16px;font-weight:700;margin-bottom:16px}

/* Stats Grid */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.stat-card__label{font-size:12px;color:#888;margin-bottom:8px}
.stat-card__value{font-size:28px;font-weight:800;color:#1f7a74}
.stat-card__value.danger{color:#e74c3c}
.stat-card__value.warning{color:#dfa948}

/* Tables */
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:left;padding:10px 12px;border-bottom:2px solid #f0f0f0;color:#666;font-weight:600;white-space:nowrap}
.table td{padding:10px 12px;border-bottom:1px solid #f5f5f5}
.table tr:hover{background:#fafafa}
/* Full (non-truncated) ID cell with hover preview + click-to-copy */
.uid{font-family:monospace;font-size:11px;color:#556;word-break:break-all;display:inline-block;max-width:220px;cursor:pointer;vertical-align:top}
.uid:hover{color:#1f7a74;text-decoration:underline}
.table__actions{display:flex;gap:6px}
.moment-content-cell{max-width:320px;white-space:pre-wrap;word-break:break-word;line-height:1.5}
.moment-thumb{width:46px;height:46px;object-fit:cover;border-radius:6px;cursor:pointer;vertical-align:middle;border:1px solid #eee}
.moment-thumb:hover{opacity:.85}
.moment-detail-img{width:100%;border-radius:8px;border:1px solid #eee}
.btn-sm{padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600}
.btn-primary{background:#1f7a74;color:#fff}
.btn-danger{background:#e74c3c;color:#fff}
.btn-warning{background:#dfa948;color:#fff}
.btn-ghost{background:#f0f0f0;color:#333}
.btn-success{background:#27ae60;color:#fff}

/* Search */
.search-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.search-bar input,.search-bar select{padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px}
.search-bar input{flex:1;min-width:200px}

/* Badges */
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.badge-active{background:#e8f5e9;color:#27ae60}
.badge-restricted{background:#fff3e0;color:#f57c00}
.badge-frozen{background:#e3f2fd;color:#1976d2}
.badge-banned{background:#ffebee;color:#c62828}
.badge-pending{background:#fff8e1;color:#f57c00}
.badge-paid{background:#e8f5e9;color:#27ae60}
.badge-refunded{background:#fce4ec;color:#c62828}

/* Pagination */
.pagination{display:flex;gap:6px;justify-content:center;margin-top:16px}
.pagination button{padding:6px 12px;border:1px solid #ddd;border-radius:6px;font-size:13px}
.pagination button.active{background:#1f7a74;color:#fff;border-color:#1f7a74}
.pagination button:disabled{opacity:.4}

/* Support tickets */
.ticket-list{display:flex;flex-direction:column;gap:14px;margin-bottom:16px}
.ticket-card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);border-left:3px solid #ef7b62}
.ticket-card__head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.ticket-card__type{font-size:14px;font-weight:700;color:#172b2d}
.ticket-card__meta{font-size:12px;color:#718082;margin-bottom:8px}
.ticket-card__subject{font-size:14px;font-weight:600;color:#172b2d;margin-bottom:6px}
.ticket-card__desc{font-size:13px;color:#3c4a4a;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.ticket-card__contact{font-size:12px;color:#718082;margin-top:6px}
.ticket-card__reply{font-size:13px;color:#1f7a74;line-height:1.6;background:rgba(31,122,116,.06);border-radius:8px;padding:8px 10px;margin-top:8px;white-space:pre-wrap;word-break:break-word}
.ticket-card__actions{margin-top:10px}
.ticket-reply-box{margin-top:10px;padding-top:10px;border-top:1px dashed #eee}
.ticket-reply-box textarea{width:100%;min-height:70px;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:13px;line-height:1.5;resize:vertical}
.ticket-reply-box__btns{display:flex;gap:10px;margin-top:8px}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:12px;width:600px;max-height:80vh;overflow-y:auto;max-width:90vw}
.modal__header{padding:16px 20px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
.modal__title{font-size:16px;font-weight:700}
.modal__close{font-size:20px;color:#999;cursor:pointer}
.modal__body{padding:20px}
.modal__footer{padding:12px 20px;border-top:1px solid #eee;display:flex;justify-content:flex-end;gap:8px}

/* Forms */
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;color:#666;font-weight:600;margin-bottom:6px}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px}
.form-row{display:flex;gap:12px}
.form-row .form-group{flex:1}

/* Toast */
#toast{position:fixed;top:20px;right:20px;background:rgba(0,0,0,.8);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;z-index:9999;opacity:0;transition:opacity .3s;max-width:300px}
#toast.show{opacity:1}

/* Config form */
.config-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.config-item{display:flex;flex-direction:column;gap:4px}
.config-item label{font-size:12px;color:#666;font-weight:600}
.config-item input{padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px}

/* Site mail */
.mail-compose{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(340px,.95fr);gap:16px;align-items:start}
.mail-help{font-size:12px;color:#888;line-height:1.6;margin-top:5px}
.mail-history-title{max-width:260px;font-weight:700;color:#243b3a}
.mail-history-summary{max-width:360px;color:#667673;white-space:normal;line-height:1.5}
.mail-stat{white-space:nowrap;color:#1f7a74;font-weight:600}
@media(max-width:1000px){.mail-compose{grid-template-columns:1fr}}

.hidden{display:none!important}
</style>
</head>
<body>

<!-- Login Page -->
<div id="loginPage" class="login-page">
  <div class="login-card">
    <h1>漂流大厅 · 管理后台</h1>
    <p>请登录管理员账号</p>
    <div class="login-field">
      <label>账号</label>
      <input type="text" id="adminUser" value="admin" placeholder="管理员账号">
    </div>
    <div class="login-field">
      <label>密码</label>
      <input type="password" id="adminPass" value="admin123" placeholder="管理员密码">
    </div>
    <button class="login-btn" id="adminLoginBtn">登录</button>
  </div>
</div>

<!-- Admin Panel -->
<div id="adminPanel" class="admin-layout hidden">
  <div class="sidebar">
    <div class="sidebar__logo">🏝️ 漂流大厅</div>
    <div class="sidebar__nav">
      <div class="sidebar__item active" onclick="switchTab('dashboard')">📊 数据概览</div>
      <div class="sidebar__item" onclick="switchTab('users')">👥 用户管理</div>
      <div class="sidebar__item" onclick="switchTab('bottles')">🍾 漂流瓶管理</div>
      <div class="sidebar__item" onclick="switchTab('moments')">📸 动态管理</div>
      <div class="sidebar__item" onclick="switchTab('coins')">🪙 漂流币管理</div>
      <div class="sidebar__item" onclick="switchTab('orders')">💰 充值订单 <span class="sidebar__badge hidden" id="orderBadge"></span></div>
      <div class="sidebar__item" onclick="switchTab('redeem')">🎟️ 卡密管理</div>
      <div class="sidebar__item" onclick="switchTab('reports')">⚠️ 举报管理 <span class="sidebar__badge hidden" id="reportBadge"></span></div>
      <div class="sidebar__item" onclick="switchTab('support')">🎫 客服工单 <span class="sidebar__badge hidden" id="supportBadge"></span></div>
      <div class="sidebar__item" onclick="switchTab('mail')">✉️ 站内信推送</div>
      <div class="sidebar__item" onclick="switchTab('popups')">📣 弹窗推送</div>
      <div class="sidebar__item" onclick="switchTab('bots')">🤖 机器人管理</div>
      <div class="sidebar__item" onclick="switchTab('config')">⚙️ 业务配置</div>
      <div class="sidebar__item" onclick="switchTab('audit')">📋 审计日志</div>
    </div>
    <div style="padding:16px 20px;border-top:1px solid rgba(255,255,255,.1)">
      <button onclick="adminLogout()" style="color:rgba(255,255,255,.6);font-size:13px">退出登录</button>
    </div>
  </div>
  <div class="main">
    <div class="main__header">
      <div class="main__title" id="pageTitle">数据概览</div>
      <div class="main__user" id="adminInfo"></div>
    </div>
    <div id="pageContent"></div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal__header">
      <div class="modal__title" id="modalTitle"></div>
      <div class="modal__close" onclick="closeModal()">×</div>
    </div>
    <div class="modal__body" id="modalBody"></div>
    <div class="modal__footer" id="modalFooter"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
const API = (window.DRIFT_API_BASE || '/api') + '/admin';
let adminToken = localStorage.getItem('drift_admin_token');
let currentTab = 'dashboard';
let pagination = { page: 1, pageSize: 20, total: 0 };

/* ===== API Helper ===== */
async function api(path, options = {}) {
  const headers = { 'Content-Type': 'application/json', ...options.headers };
  if (adminToken) headers['Authorization'] = 'Bearer ' + adminToken;
  const res = await fetch(API + path, { ...options, headers });
  const data = await res.json();
  if (res.status === 401) { adminToken = null; localStorage.removeItem('drift_admin_token'); showLogin(); throw new Error('未登录'); }
  return data;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove('show'), 2500);
}

function showLogin() {
  document.getElementById('loginPage').classList.remove('hidden');
  document.getElementById('adminPanel').classList.add('hidden');
}
function showPanel() {
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('adminPanel').classList.remove('hidden');
}

function openModal(title, bodyHtml, footerHtml) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalFooter').innerHTML = footerHtml || '';
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('show'); }

function badgeClass(status) {
  const m = { active:'badge-active', restricted:'badge-restricted', frozen:'badge-frozen', banned:'badge-banned',
    pending:'badge-pending', paid:'badge-paid', refunded:'badge-refunded', deleted:'badge-banned',
    displaying:'badge-active', expired:'badge-restricted', resolved:'badge-active', dismissed:'badge-restricted' };
  return m[status] || 'badge-active';
}
function formatTime(ts) {
  if (!ts) return '-';
  const d = new Date(ts);
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
// Render a full (never truncated) ID. Click copies it; hover shows the complete value.
function fmtId(id) {
  if (!id) return '-';
  return `<span class="uid" title="点击复制完整ID：${escapeHtml(id)}" onclick="copyText('${escapeHtml(id)}')">${escapeHtml(id)}</span>`;
}

/* ===== Login ===== */
document.getElementById('adminLoginBtn').onclick = async function() {
  const username = document.getElementById('adminUser').value.trim();
  const password = document.getElementById('adminPass').value.trim();
  if (!username || !password) { showToast('请输入账号和密码'); return; }
  this.textContent = '登录中...'; this.disabled = true;
  try {
    const res = await api('/login', { method: 'POST', body: JSON.stringify({ username, password }) });
    if (res.success) {
      adminToken = res.token;
      localStorage.setItem('drift_admin_token', adminToken);
      document.getElementById('adminInfo').textContent = `管理员: ${res.admin.username}`;
      showPanel();
      switchTab('dashboard');
    } else { showToast(res.error || '登录失败'); }
  } catch (e) { showToast('登录失败'); }
  this.textContent = '登录'; this.disabled = false;
};
document.getElementById('adminPass').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('adminLoginBtn').click(); });

function adminLogout() {
  adminToken = null;
  localStorage.removeItem('drift_admin_token');
  showLogin();
}

/* ===== Tab Switching ===== */
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.sidebar__item').forEach((el, i) => {
    const tabs = ['dashboard','users','bottles','moments','coins','orders','redeem','reports','support','mail','popups','bots','config','audit'];
    el.classList.toggle('active', tabs[i] === tab);
  });
  const titles = { dashboard:'数据概览', users:'用户管理', bottles:'漂流瓶管理', moments:'动态管理', coins:'漂流币管理', orders:'充值订单', redeem:'卡密管理', reports:'举报管理', support:'客服工单', mail:'站内信推送', popups:'弹窗推送', bots:'机器人管理', config:'业务配置', audit:'审计日志' };
  document.getElementById('pageTitle').textContent = titles[tab];
  pagination = { page: 1, pageSize: 20, total: 0 };
  renderTab();
}

async function renderTab() {
  const c = document.getElementById('pageContent');
  c.innerHTML = '<div style="text-align:center;padding:40px;color:#999">加载中...</div>';
  try {
    if (currentTab === 'dashboard') await renderDashboard();
    else if (currentTab === 'users') await renderUsers();
    else if (currentTab === 'bottles') await renderBottles();
    else if (currentTab === 'moments') await renderMoments();
    else if (currentTab === 'coins') await renderCoins();
    else if (currentTab === 'orders') await renderOrders();
    else if (currentTab === 'redeem') await renderRedeemCodes();
    else if (currentTab === 'reports') await renderReports();
    else if (currentTab === 'support') await renderSupport();
    else if (currentTab === 'mail') await renderSiteMail();
    else if (currentTab === 'popups') await renderPopupNotifications();
    else if (currentTab === 'bots') await renderBots();
    else if (currentTab === 'config') await renderConfig();
    else if (currentTab === 'audit') await renderAudit();
  } catch (e) { c.innerHTML = '<div style="text-align:center;padding:40px;color:#e74c3c">加载失败，请重试</div>'; }
  refreshBadges();
}

/* ===== Sidebar badges (待办提醒) ===== */
function setBadge(id, count) {
  const el = document.getElementById(id);
  if (!el) return;
  if (count > 0) {
    el.textContent = count > 99 ? '99+' : count;
    el.classList.remove('hidden');
  } else {
    el.classList.add('hidden');
  }
}
async function refreshBadges() {
  try {
    const res = await api('/dashboard');
    if (!res.success) return;
    const s = res.stats;
    setBadge('orderBadge', s.pendingOrders || 0);
    setBadge('reportBadge', s.pendingReports || 0);
    setBadge('supportBadge', s.pendingSupport || 0);
  } catch (e) {}
}

/* ===== Dashboard ===== */
async function renderDashboard() {
  const res = await api('/dashboard');
  if (!res.success) return;
  const s = res.stats;
  const c = document.getElementById('pageContent');
  c.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-card__label">总注册用户</div><div class="stat-card__value">${s.totalUsers}</div></div>
      <div class="stat-card"><div class="stat-card__label">今日新增注册</div><div class="stat-card__value">${s.newUsersToday}</div></div>
      <div class="stat-card"><div class="stat-card__label">日活用户</div><div class="stat-card__value">${s.dailyActive}</div></div>
      <div class="stat-card"><div class="stat-card__label">漂流瓶总量</div><div class="stat-card__value">${s.totalBottles}</div></div>
      <div class="stat-card"><div class="stat-card__label">社区动态</div><div class="stat-card__value">${s.totalMoments}</div></div>
      <div class="stat-card"><div class="stat-card__label">聊天会话</div><div class="stat-card__value">${s.totalSessions}</div></div>
      <div class="stat-card"><div class="stat-card__label">充值总额</div><div class="stat-card__value">¥${s.totalRecharged}</div></div>
      <div class="stat-card"><div class="stat-card__label">漂流币流通</div><div class="stat-card__value">${s.totalCoinsInCirculation}</div></div>
      <div class="stat-card"><div class="stat-card__label">待确认到账并发码</div><div class="stat-card__value warning">${s.pendingOrders}</div></div>
      <div class="stat-card"><div class="stat-card__label">未解决工单</div><div class="stat-card__value warning">${s.pendingSupport}</div></div>
      <div class="stat-card"><div class="stat-card__label">待处理举报</div><div class="stat-card__value warning">${s.pendingReports}</div></div>
      <div class="stat-card"><div class="stat-card__label">处罚账号</div><div class="stat-card__value danger">${s.penalizedAccounts}</div></div>
      <div class="stat-card"><div class="stat-card__label">封禁账号</div><div class="stat-card__value danger">${s.bannedUsers}</div></div>
      <div class="stat-card"><div class="stat-card__label">累计注销用户</div><div class="stat-card__value danger">${s.deletedUsers}</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
      <div class="card">
        <div class="card__title">最近注册用户</div>
        <table class="table">
          <thead><tr><th>手机号</th><th>邮箱</th><th>昵称</th><th>状态</th><th>注册时间</th></tr></thead>
          <tbody>${res.recentUsers.map(u => `<tr><td>${escapeHtml(u.phone)}</td><td>${escapeHtml(u.email || '-')}</td><td>${escapeHtml(u.nickname)}</td><td><span class="badge ${badgeClass(u.status)}">${u.status}</span></td><td>${formatTime(u.createdAt)}</td></tr>`).join('')}</tbody>
        </table>
      </div>
      <div class="card">
        <div class="card__title">最近举报</div>
        <table class="table">
          <thead><tr><th>类型</th><th>原因</th><th>状态</th><th>时间</th></tr></thead>
          <tbody>${res.recentReports.map(r => `<tr><td>${escapeHtml(r.targetType)}</td><td>${escapeHtml(r.reason)}</td><td><span class="badge ${badgeClass(r.status)}">${r.status}</span></td><td>${formatTime(r.createdAt)}</td></tr>`).join('')}</tbody>
        </table>
      </div>
    </div>`;
}

/* ===== Users ===== */
let userSearch = '', userStatus = 'all';
let usersCache = [];
async function renderUsers() {

function showPenalize(id) {
  const u = (usersCache || []).find(x => x.id === id);
  const name = u ? u.nickname : '该用户';
  openModal('处罚用户 - ' + name, `
    <div class="form-group">
      <label>处罚操作</label>
      <select id="penalizeAction" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px">
        <option value="restrict_publish">限制发布</option>
        <option value="restrict_chat">限制聊天</option>
        <option value="freeze">冻结账号</option>
        <option value="ban">封禁账号</option>
        <option value="restore">恢复正常</option>
      </select>
    </div>
    <div class="form-group">
      <label>处罚原因</label>
      <textarea id="penalizeReason" style="width:100%;min-height:80px;padding:10px;border:1px solid #ddd;border-radius:8px" placeholder="请填写处罚原因..."></textarea>
    </div>
  `, `<button class="btn-sm btn-ghost" onclick="closeModal()">取消</button><button class="btn-sm btn-danger" onclick="doPenalize('${id}')">确认处罚</button>`);
}

async function doPenalize(id) {
  const action = document.getElementById('penalizeAction').value;
  const reason = document.getElementById('penalizeReason').value.trim();
  const res = await api(`/users/${id}/penalize`, { method: 'POST', body: JSON.stringify({ action, reason }) });
  if (res.success) { showToast('操作成功'); closeModal(); renderUsers(); }
  else showToast(res.error || '操作失败');
}

// Set / clear a user's verification badge.
async function doVerifyUser(id, type) {
  const verified = !!type;
  const res = await api(`/users/${id}/verify`, { method: 'POST', body: JSON.stringify({ verified, verifiedType: type || 'personal' }) });
  if (res.success) { showToast(verified ? '已设为认证用户' : '已取消认证'); closeModal(); renderUsers(); }
  else showToast(res.error || '操作失败');
}

/* ===== Redeem Codes (卡密充值) ===== */
let redeemStatus = 'all';

function copyText(t) {
  navigator.clipboard.writeText(t).then(() => showToast('已复制')).catch(() => showToast('复制失败，请手动复制'));
}

async function renderRedeemCodes() {
  const res = await api(`/redeem-codes?status=${redeemStatus}&page=${pagination.page}&pageSize=${pagination.pageSize}`);
  if (!res.success) return;
  pagination.total = res.total;
  const c = document.getElementById('pageContent');
  c.innerHTML = `
    <div class="card" style="margin-bottom:16px">
      <div class="card__title">生成卡密</div>
      <div class="form-row">
        <div class="form-group"><label>每份面额（漂流币）</label><input type="number" id="rcCoins" value="10" min="1"></div>
        <div class="form-group"><label>生成数量</label><input type="number" id="rcCount" value="10" min="1" max="500"></div>
        <div class="form-group"><label>前缀（可选，≤6位）</label><input type="text" id="rcPrefix" placeholder="如 TEST" maxlength="6"></div>
        <div class="form-group"><label>备注（可选）</label><input type="text" id="rcNote" placeholder="批次备注"></div>
        <div class="form-group" style="display:flex;align-items:flex-end"><button class="btn-sm btn-primary" style="padding:10px 20px" onclick="generateRedeemCodes()">生成卡密</button></div>
      </div>
      <div style="font-size:12px;color:#98a2a0;margin-top:6px">每张卡密一次性使用，用户端「充值漂流币 → 兑换码充值」粘贴即可到账。</div>
    </div>
    <div class="card">
      <div class="card__title" style="display:flex;justify-content:space-between;align-items:center">
        <span>卡密列表（共 ${res.total} 张）</span>
        <select onchange="redeemStatus=this.value;pagination.page=1;renderRedeemCodes()" style="padding:6px 10px;border-radius:8px;border:1px solid #ddd">
          <option value="all" ${redeemStatus==='all'?'selected':''}>全部</option>
          <option value="unused" ${redeemStatus==='unused'?'selected':''}>未使用</option>
          <option value="used" ${redeemStatus==='used'?'selected':''}>已使用</option>
        </select>
      </div>
      <table class="table">
        <thead><tr><th>兑换码</th><th>面额</th><th>状态</th><th>使用人</th><th>生成时间</th></tr></thead>
        <tbody>
          ${(res.codes||[]).map(r => `<tr>
            <td><code style="cursor:pointer;color:#1f7a74" onclick="copyText('${r.code}')" title="点击复制">${r.code}</code></td>
            <td>${r.coins} 枚</td>
            <td><span class="badge ${r.status==='used'?'badge-paid':'badge-active'}">${r.status==='used'?'已使用':'未使用'}</span></td>
            <td>${r.usedByPhone || '-'}</td>
            <td>${formatTime(r.createdAt)}</td>
          </tr>`).join('') || '<tr><td colspan="5" style="text-align:center;color:#999">暂无卡密</td></tr>'}
        </tbody>
      </table>
      ${renderPagination()}
    </div>`;
}

async function generateRedeemCodes() {
  const coins = parseInt(document.getElementById('rcCoins').value, 10);
  const count = parseInt(document.getElementById('rcCount').value, 10);
  const prefix = document.getElementById('rcPrefix').value.trim();
  const note = document.getElementById('rcNote').value.trim();
  if (!coins || coins < 1) { showToast('面额必须为正整数'); return; }
  if (!count || count < 1 || count > 500) { showToast('数量需为 1-500'); return; }
  const res = await api('/redeem-codes/generate', { method: 'POST', body: JSON.stringify({ coins, count, prefix, note }) });
  if (!res.success) { showToast(res.error || '生成失败'); return; }
  showToast(`已生成 ${res.count} 张卡密`);
  const codesText = res.codes.map(x => x.code).join('\n');
  openModal(`生成成功（${res.count} 张，每张 ${coins} 枚）`,
    `<div style="font-size:12px;color:#666;margin-bottom:8px">请妥善保存，以下卡密仅显示一次：</div><textarea id="rcCodesBox" readonly style="width:100%;height:180px;font-family:monospace;padding:8px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box">${codesText}</textarea>`,
    `<button class="btn-sm btn-ghost" onclick="closeModal()">关闭</button><button class="btn-sm btn-primary" onclick="copyText(document.getElementById('rcCodesBox').value)">复制全部</button>`
  );
  renderRedeemCodes();
}

// Open full-size view of a proof/payment image in a modal lightbox
function viewImage(src) {
  if (!src) return;
  openModal('支付凭证大图', `
    <div style="text-align:center">
      <img src="${src}" style="max-width:100%;max-height:70vh;border-radius:8px;object-fit:contain;background:#f5f5f5" onerror="this.alt='图片加载失败';this.style.padding='20px';this.style.color='#999'" />
    </div>
  `, `<button class="btn-sm btn-ghost" onclick="closeModal()">关闭</button>`);
}

async function refundOrder(id) {
  const reason = prompt('请输入退款原因：');
  if (!reason) return;
  const res = await api(`/orders/${id}/refund`, { method: 'POST', body: JSON.stringify({ reason }) });
  if (res.success) { showToast('退款成功'); renderOrders(); }
  else showToast(res.error || '退款失败');
}

async function adminConfirmOrder(id) {
  if (!confirm('确认已收到该笔付款，并生成兑换码？\n\n用户需凭兑换码自行兑换漂流币。')) return;
  const res = await api(`/orders/${id}/confirm`, { method: 'POST', body: JSON.stringify({}) });
  if (res.success) {
    const code = res.redeemCode && res.redeemCode.code ? res.redeemCode.code : '';
    openModal('确认成功', `
      <div style="text-align:center">
        <p style="margin-bottom:12px">已为该订单生成兑换码，共 ${res.coins} 枚漂流币</p>
        <div style="font-family:monospace;font-size:18px;font-weight:700;color:#1f7a74;background:#e9f5f3;padding:12px 16px;border-radius:8px;display:inline-block;letter-spacing:1px">${code}</div>
        <p style="font-size:12px;color:#888;margin-top:12px">可复制此码发送给用户，用户需在「充值 → 兑换码充值」中粘贴兑换。</p>
      </div>
    `, `<button class="btn-sm btn-ghost" onclick="closeModal()">关闭</button><button class="btn-sm btn-primary" onclick="copyText('${code.replace(/'/g, "\\'")}')">复制兑换码</button>`);
    renderOrders();
  }
  else showToast(res.error || '操作失败');
}

async function adminRejectOrder(id) {
  const reason = prompt('请输入拒绝原因（如：未收到付款）：');
  if (!reason) return;
  const res = await api(`/orders/${id}/reject`, { method: 'POST', body: JSON.stringify({ reason }) });
  if (res.success) { showToast('已拒绝'); renderOrders(); }
  else showToast(res.error || '操作失败');
}

async function handleReport(id, result) {
  const note = prompt('处理备注：') || '';
  const res = await api(`/reports/${id}/handle`, { method: 'POST', body: JSON.stringify({ result, note }) });
  if (res.success) { showToast('处理成功'); renderReports(); }
  else showToast(res.error || '处理失败');
}

/* ===== Support (客服工单) ===== */
let supportStatus = 'pending';
async function renderSupport() {
  const res = await api(`/support?status=${supportStatus}&page=${pagination.page}&pageSize=${pagination.pageSize}`);
  if (!res.success) return;
  pagination.total = res.total;
  const c = document.getElementById('pageContent');
  const list = res.tickets.length ? res.tickets.map(t => {
    const typeLabel = t.type === 'problem' ? '🐞 问题反馈' : '💡 功能建议';
    const statusLabel = t.status === 'pending' ? '待处理' : (t.status === 'resolved' ? '已解决' : '已回复');
    const canHandle = t.status === 'pending' || t.status === 'replied';
    return `<div class="ticket-card">
      <div class="ticket-card__head">
        <span class="ticket-card__type">${typeLabel}</span>
        <span class="badge ${badgeClass(t.status)}">${statusLabel}</span>
      </div>
      <div class="ticket-card__meta">用户：${escapeHtml(t.userNickname)}（${escapeHtml(t.userPhone || '-')}）· ${formatTime(t.createdAt)}</div>
      ${t.subject ? `<div class="ticket-card__subject">${escapeHtml(t.subject)}</div>` : ''}
      <div class="ticket-card__desc">${escapeHtml(t.description)}</div>
      ${t.contact ? `<div class="ticket-card__contact">联系方式：${escapeHtml(t.contact)}</div>` : ''}
      ${t.reply ? `<div class="ticket-card__reply"><b>管理员回复：</b>${escapeHtml(t.reply)}</div>` : ''}
      ${canHandle ? `<div class="ticket-card__actions">
        <button class="btn-sm btn-primary" onclick="showSupportReply('${t.id}')">回复 / 解决</button>
      </div>
      <div id="supportReplyBox-${t.id}" class="ticket-reply-box hidden">
        <textarea id="supportReplyText-${t.id}" placeholder="填写回复内容（可选）"></textarea>
        <div class="ticket-reply-box__btns">
          <button class="btn-sm btn-success" onclick="handleSupport('${t.id}','resolve')">标记已解决</button>
          <button class="btn-sm btn-primary" onclick="handleSupport('${t.id}','reply')">仅回复</button>
        </div>
      </div>` : ''}
    </div>`;
  }).join('') : '<div style="text-align:center;padding:40px;color:#999">暂无工单</div>';
  c.innerHTML = `
    <div class="search-bar">
      <select onchange="supportStatus=this.value;pagination.page=1;renderSupport()">
        <option value="pending" ${supportStatus==='pending'?'selected':''}>待处理</option>
        <option value="replied" ${supportStatus==='replied'?'selected':''}>已回复</option>
        <option value="resolved" ${supportStatus==='resolved'?'selected':''}>已解决</option>
        <option value="all" ${supportStatus==='all'?'selected':''}>全部</option>
      </select>
    </div>
    <div class="ticket-list">${list}</div>
    ${renderPagination()}`;
}

function showSupportReply(id) {
  const box = document.getElementById('supportReplyBox-' + id);
  if (box) box.classList.toggle('hidden');
}

async function handleSupport(id, action) {
  const ta = document.getElementById('supportReplyText-' + id);
  const reply = ta ? ta.value.trim() : '';
  const res = await api(`/support/${id}/handle`, { method: 'POST', body: JSON.stringify({ action, reply }) });
  if (res.success) {
    showToast(action === 'resolve' ? '已标记为已解决' : '已回复');
    renderSupport();
  } else showToast(res.error || '操作失败');
}

async function saveCoinOperationMode() {
  const select = document.getElementById('cfg_coin_operation_mode');
  if (!select) return;
  const mode = select.value;
  const label = mode === 'normal' ? '正常运营模式' : '免费推广模式';
  if (!confirm(`确认切换为“${label}”？`)) return;
  const res = await api('/config', { method:'POST', body:JSON.stringify({ coin_operation_mode: mode }) });
  if (!res.success) return showToast(res.error || '切换失败', 'error');
  showToast(`已切换为${label}`);
  renderConfig();
}

async function saveMaintenanceSettings() {
  const enabled = document.getElementById('cfg_maintenance_mode').checked;
  const title = document.getElementById('cfg_maintenance_title').value.trim();
  const message = document.getElementById('cfg_maintenance_message').value.trim();
  const estimatedEndAt = document.getElementById('cfg_maintenance_end_at').value;
  if (!title || !message) return showToast('请填写维护标题和提示内容', 'error');
  if (enabled && !confirm('确认开启系统维护？所有在线用户将立即看到维护页面。')) return;
  const res = await api('/config', {
    method:'POST',
    body:JSON.stringify({
      maintenance_mode: enabled,
      maintenance_title: title,
      maintenance_message: message,
      maintenance_end_at: estimatedEndAt
    })
  });
  if (!res.success) return showToast(res.error || '保存失败', 'error');
  showToast(enabled ? '维护模式已开启' : '维护模式已关闭');
  renderConfig();
}

async function sendSiteMailFromAdmin() {
  const button = document.getElementById('mailSendBtn');
  const payload = {
    type: document.getElementById('mailType').value,
    version: document.getElementById('mailVersion').value.trim(),
    title: document.getElementById('mailTitle').value.trim(),
    summary: document.getElementById('mailSummary').value.trim(),
    content: document.getElementById('mailContent').value.trim(),
    targetType: document.getElementById('mailTargetType').value,
    targetIdentifiers: document.getElementById('mailTargets')?.value || ''
  };
  if (!payload.title) return showToast('请填写站内信标题');
  if (!payload.content) return showToast('请填写站内信正文');
  if (payload.targetType === 'specific' && !payload.targetIdentifiers.trim()) return showToast('请填写指定用户');
  if (!confirm(`确认向${payload.targetType === 'all' ? '全体可登录用户' : '指定用户'}推送这封站内信？`)) return;
  button.disabled = true;
  button.textContent = '推送中...';
  try {
    const res = await api('/mail/send', { method:'POST', body:JSON.stringify(payload) });
    if (!res.success) throw new Error(res.error || '发送失败');
    const suffix = res.unresolved && res.unresolved.length ? `，${res.unresolved.length} 个账号未匹配` : '';
    showToast(`已送达 ${res.deliveredCount} 位用户${suffix}`);
    await renderSiteMail();
  } catch (error) {
    showToast(error.message || '发送失败');
    button.disabled = false;
    button.textContent = '确认推送';
  }
}

  const b = (res.bots || []).find(x => x.botId === botId);

  openModal('编辑机器人', botEditForm(b), [
    { text: '取消', cancel: true },
    { text: '保存', onClick: async () => {
      const updates = {
        displayName: document.getElementById('bot_displayName').value.trim(),
        genderDisplay: document.getElementById('bot_genderDisplay').value.trim(),
        speakingStyle: document.getElementById('bot_speakingStyle').value.trim(),
        personaPrompt: document.getElementById('bot_personaPrompt').value.trim(),
        activityWeight: parseFloat(document.getElementById('bot_activityWeight').value) || 1

      const dp = document.getElementById('bot_dailyMaxPosts').value;

      if (r2.success) { closeModal(); renderBots(); showToast('已保存'); }
      else showToast(r2.error || '保存失败');

// Compress an image file to a capped data URL (keeps the JSON DB small)
function adminFileToDataURL(file, maxW) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function onPaymentQRSelected(input) {
  const file = input.files && input.files[0];

  try {

/* ===== Pagination ===== */
function renderPagination() {
  const pages = Math.ceil(pagination.total / pagination.pageSize);
  if (pages <= 1) return '';
  let html = '<div class="pagination">';
  html += `<button ${pagination.page<=1?'disabled':''} onclick="pagination.page--;renderTab()">上一页</button>`;
  for (let i = 1; i <= Math.min(pages, 10); i++) {
    html += `<button class="${i===pagination.page?'active':''}" onclick="pagination.page=${i};renderTab()">${i}</button>`;
  }
  html += `<button ${pagination.page>=pages?'disabled':''} onclick="pagination.page++;renderTab()">下一页</button>`;
  html += `</div><div style="text-align:center;font-size:12px;color:#999;margin-top:8px">共 ${pagination.total} 条</div>`;
  return html;
}
